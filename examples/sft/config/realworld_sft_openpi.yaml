defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    env,rollout: 0

runner:
  task_type: sft
  logger:
    log_path: "/root/autodl-tmp/logs/results"
    project_name: rlinf
    experiment_name: "realworld_sft_openpi"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2000
    #resume_dir: "/root/autodl-tmp/logs/20260704-14:28:11-realworld_sft_openpi/realworld_sft_openpi/checkpoints/global_step_5000"

data:
  train_data_paths: "/root/autodl-tmp/data/sft_data/task_5867" # path to lerobot data

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 32
  seed: 0

  model:
    precision: null
    model_path: "/root/autodl-tmp/pi05_base/"
    num_action_chunks: 15
    action_dim: 32
    add_value_head: False
    is_lora: True 
    lora_rank: 32
    openpi:
      config_name: "pi05_a2d"
      detach_critic_input: True
      num_images_in_input: 3

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 1000
    total_training_steps: 30000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
