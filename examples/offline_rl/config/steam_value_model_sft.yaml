# Usage: bash examples/offline_rl/advantage_labeling/steam/run_steam_sft.sh steam_value_model_sft

defaults:
  - model/steam_value_model@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "steam_sft"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  #max_steps: 16000
  max_steps: 5000
  val_check_interval: -1
  save_interval: 1000
  #resume_dir: "/root/autodl-tmp/RLinf/logs/steam_sft/steam_value_model_sft-20260724-17:12:38/steam_sft/checkpoints/global_step_1000"
  resume_dir: null

data:
  train_data_paths:
    - dataset_path: "/root/autodl-tmp/data/sft_data/task_5867"
      type: sft
      exclude_file: "/root/autodl-tmp/RLinf/reports/data_quality/task_5867/exclude_a2d.txt"

    - dataset_path: "/root/autodl-tmp/data_new/sft_data/task_5867_203/task_5867"
      type: sft
      exclude_file: "/root/autodl-tmp/RLinf/reports/data_quality/task_5867_203/exclude_a2d.txt"

    - dataset_path: "/root/autodl-tmp/data_new/rollout_data/record_dataset_new3"
      type: rollout
      exclude_file: "/root/autodl-tmp/RLinf/reports/data_quality/record_dataset_new3/exclude_a2d.txt"
  balance_weights: true
  seed: 42
  dataset_type: sft

  #camera_keys:
   # - observation.images.global
   # - observation.images.right
   # - observation.images.wrist

  camera_keys:
    - observation.images.top_head
    - observation.images.hand_left
    - observation.images.hand_right

  k: 128
  # false = train on all episodes (success + failure); true = keep only
  # successful episodes (rollout datasets only; sft is always all-success).
  only_success: false
  min_episode_length: null

  #train_num_workers: 8
  #eval_num_workers: 2
  #prefetch_factor: 4
  train_num_workers: 0
  eval_num_workers: 0
  prefetch_factor: null
  persistent_workers: false
  pin_memory: false
  do_augment: false

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  #micro_batch_size: 2
  #global_batch_size: 16
  micro_batch_size: 8
  global_batch_size: 64
  seed: 0

  model:
    #precision: bf16
    precision: fp32
    fusion_hidden_dim: 512
    dropout: 0.1
    label_smoothing: 0.05
    num_frames_per_pair: 2
    num_bins: 16
    vision_repo_id: "/root/autodl-tmp/siglip-so400m-patch14-384"
    language_repo_id: "/root/autodl-tmp/gemma-3-270m"
    tokenizer_path: "/root/autodl-tmp/gemma-3-270m"

    siglip_path: "/root/autodl-tmp/siglip-so400m-patch14-384"
    gemma3_path: "/root/autodl-tmp/gemma-3-270m"

    freeze_vision_encoder: false
    freeze_language_model: false
    include_state_in_prompt: false
    max_state_dim: 32
    state_discretization_bins: 256
    max_token_len: 200
    ensemble_size: 1
    ensemble_head_seed_base: 0
    use_gradient_checkpointing: true

  optim:
    lr: 5.0e-5
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 10.0
    lr_scheduler: "constant"
    #lr_warmup_steps: 500
    lr_warmup_steps: 100
    total_training_steps: 5000
    min_lr: 1.0e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
